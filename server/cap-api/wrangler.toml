# CAP Online API – Cloudflare Worker: konton (koder/inbjudningar), filmer med taggar, uppladdning.
# Driftsätt: bash tools/api-deploy.sh   (token i .secrets/cloudflare-workers.txt)
# Hemligheter: ADMIN_LOSEN (adminsidans lösenord), PUSH_HEMLIG (samma som cap-push ADMIN_HEMLIG),
# SMS_USER + SMS_PASS (46elks, valfritt: utan dem skickar Haris länken själv från telefonen), SMS_FROM (avsändare, CapSwe) och SMS_MAX_DAG (tak per dygn, 25) står under [vars].
# R2 (filmlagring): slå på R2 i Cloudflare-dashboarden och ge token "Workers R2 Storage: Edit",
# ta sedan bort kommentarerna på [[r2_buckets]] nedan och kör bash tools/api-deploy.sh --r2.
name = "cap-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
routes = [{ pattern = "cap-api.8bitcat.io", custom_domain = true }]

[vars]
APP_BASE = "https://8bitcat.github.io/cap-online/"
PUSH_BASE = "https://cap-push.8bitcat.io"
# sms: avsändare, tak per dygn och länken till appen (tom tills TestFlight-länken eller App Store finns)
SMS_FROM = "CapSwe"
SMS_MAX_DAG = "25"
APP_LANK_IOS = ""

[[kv_namespaces]]
binding = "DB"
id = "82d710ec9f334606ac2fc8ab2f0aaca5"

# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "cap-media"
